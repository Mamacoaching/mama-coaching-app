<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MAMA Coaching | Student Portal</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#eef5ff;color:#123b70}
header{background:#103d7c;color:white;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
header strong{font-size:18px}a.open{display:inline-block;padding:10px 14px;border-radius:9px;background:#f97316;color:white;text-decoration:none;font-weight:700;font-size:14px}
iframe{display:block;width:100%;height:calc(100dvh - 64px);border:0;background:white}
</style>
<script src="./config.js"></script>
</head>
<body>
<header><strong>🎓 MAMA Coaching</strong><a class="open" id="direct" target="_blank" rel="noopener noreferrer">Portal खोलें</a></header>
<iframe id="portal" title="MAMA Coaching Student Portal" allow="camera; geolocation" referrerpolicy="strict-origin-when-cross-origin"></iframe>
<script>
(function(){
  var url=window.MAMA_PORTAL_URL;
  var valid=/^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec(?:[?#]|$)/.test(url||'');
  if(!valid){document.getElementById('direct').textContent='Portal URL जाँचें';return;}
  document.getElementById('portal').src=url;
  document.getElementById('direct').href=url;
})();
</script>
</body>
</html>
