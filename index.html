<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#073b78">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>MAMA Coaching | Student Portal</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Arial,sans-serif;background:#eef6ff}
#portal{display:block;width:100%;height:100vh;height:100dvh;border:0}
#installApp{position:fixed;bottom:12px;left:12px;z-index:6;background:linear-gradient(120deg,#0a9f61,#0876d4);color:#fff;padding:13px 17px;border:0;border-radius:24px;font-size:14px;font-weight:bold;box-shadow:0 4px 16px #0003;cursor:pointer}#installHelp{position:fixed;bottom:65px;left:12px;z-index:7;max-width:330px;padding:14px;background:#fff;color:#17365f;border-radius:12px;box-shadow:0 4px 22px #0004;line-height:1.5;font-size:14px}#installHelp[hidden]{display:none}#direct{position:fixed;bottom:12px;right:12px;z-index:5;background:#073b78;color:white;padding:10px 14px;border-radius:24px;font-size:13px;font-weight:bold;text-decoration:none;box-shadow:0 4px 16px #0003}
</style>
</head>
<body>
<iframe id="portal" title="MAMA Coaching Full Student Portal" allow="camera; geolocation; clipboard-write" referrerpolicy="strict-origin-when-cross-origin" src="https://script.google.com/macros/s/AKfycbyzqoY_OVSSAY4N-7ppAXySDZpKrhxNFwxmzBwZWuayH4QfZTRXgykiSj50fz5FC6Y/exec"></iframe>
<button id="installApp" type="button">📲 Download / Install App</button>
<div id="installHelp" hidden>Chrome में ⋮ Menu → Cast, save and share → Install page as app चुनें। मोबाइल में ⋮ → Add to Home screen / Install app चुनें।<button type="button" id="closeHelp" style="display:block;margin-top:10px;padding:8px">बंद करें</button></div>
<a id="direct" href="https://script.google.com/macros/s/AKfycbyzqoY_OVSSAY4N-7ppAXySDZpKrhxNFwxmzBwZWuayH4QfZTRXgykiSj50fz5FC6Y/exec" target="_blank" rel="noopener noreferrer">🔐 Direct Portal</a>
<script>
let mamaInstallPrompt=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();mamaInstallPrompt=e;});document.getElementById('installApp').addEventListener('click',async()=>{if(mamaInstallPrompt){const p=mamaInstallPrompt;mamaInstallPrompt=null;try{await p.prompt();await p.userChoice;return}catch(e){}}document.getElementById('installHelp').hidden=false;});document.getElementById('closeHelp').addEventListener('click',()=>document.getElementById('installHelp').hidden=true);window.addEventListener('appinstalled',()=>{document.getElementById('installApp').textContent='✅ App Installed'});
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('./sw.js').catch(function(){});});}
</script>
</body>
</html>
